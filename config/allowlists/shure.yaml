# Shure Wireless Workbench discovery — Dante VLAN.
#
# NOT loaded by either shipped profile. Both use client_vlan: dante, where WWB
# is native to the client's own VLAN and needs no reflection. This is for the
# client_vlan: control alternative, where control apps sit on Control and this
# group is reflected to them.
# mDNS 224.0.0.251:5353 is already in dante.yaml — do not duplicate.
# Do NOT add PTP, ATP, AES67, or SSDP here.

name: shure
vlan: dante
groups:
  - name: shure-discovery
    address: 239.255.254.253
    port: 8427
    proto: udp
    direction: both
    notes: Shure Discovery / multicast SLP (WWB). Same /16 as Dante ATP; ATP is denied on UDP 4321 only.
