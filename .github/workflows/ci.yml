name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt needed:" && gofmt -l . && exit 1)

      - name: go test
        run: go test ./...

      - name: build
        run: make build

      - name: cross-build Pi and amd64
        run: |
          make build-pi
          make build-pi-arm
          make build-linux-amd64

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "PyYAML>=6" "ruff>=0.8" "mypy>=1.13" "pytest>=8" "types-PyYAML>=6"

      - name: ruff
        run: |
          python -m ruff check deploy/pi
          python -m ruff format --check deploy/pi

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest

      - name: generate-check
        run: make generate-check
