# Lab config for a flat LAN that already has DHCP and no VLAN trunk yet.
# Matches the RPi 3 test board (virgil, eth0 = 192.168.33.212/24).
#
# Optional Mgmt is UNTAGGED on eth0 (Pi uplink only). Production clients live
# on Dante, as they do here — see site.example.yaml. Reflector is Control↔Dante.
#
#   - Mgmt DHCP is DISABLED — the existing LAN router keeps serving DHCP
#   - Mgmt declares gateway/dns so the Pi keeps its uplink once networkd
#     takes over eth0 with a static address
#
# Reserve/exclude 192.168.33.212 in the LAN router so nothing else claims it.
# Control and Dante are still tagged; they stay down until the switch port
# becomes a trunk, which is fine for install and status-page smoke tests.
# Operator steps: docs/setup.md (lab section).

hostname: virgil
physical_interface: eth0
status_listen: ":8080"

# Control clients sit on Dante Primary, as in production. This is what makes
# allowlists/vunet.yaml (vlan: control) legal below — a peer role may not match
# client_vlan, so VU-NET can only be reflected when the client is on Dante.
client_vlan: dante

vlans:
  # Martin Control — the amps. Reflected peer, and the VLAN the denies protect.
  control:
    id: 200
    address: 10.200.0.1
    prefix: 21
    interface_name: eth0.200
  # Dante Network - not present in the lab but here to satisfy the configuration.
  dante:
    id: 201
    address: 10.201.0.1
    prefix: 21
    interface_name: eth0.201
  # For testing, the untagged network is the management network
  mgmt:
    id: 1
    address: 192.168.33.212
    prefix: 24
    untagged: true
    gateway: 192.168.33.1
    dns: [192.168.33.1]

# Combiner does not run DHCP on Control or Dante (core switch / existing pools).
mgmt_dhcp:
  enabled: false


# Clients are on Dante now, so Dante must be able to reach SSH and the status
# page or the operator has no way in. Control stays permitted for a laptop
# patched into the amp VLAN.
management_access: [dante, control, mgmt]

# Only VU-NET is reflected. Dante, Shure and Lake are all native to the client
# VLAN in this topology and must NOT be listed — config rejects a peer role
# that matches client_vlan.
allowlist_files:
  - allowlists/vunet.yaml

deny_multicast_prefixes:
  - 224.0.1.128/30
  - 224.0.1.132/32
  - 239.69.0.0/16
  - 239.254.3.3/32

dante_unicast_udp_ports:
  - 4440
  - 4444
  - 4455
  - 8751
  - 8800
