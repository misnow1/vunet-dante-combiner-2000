# Dante-client profile — control clients sit on Dante Primary.
#
# Use this when the operator needs full Dante Controller function. Dante
# Controller requires L2 adjacency for the metering tab and device config;
# SNAT carries discovery and some control but cannot provide those. Putting the
# laptop on Dante fixes that natively, and the combiner instead carries Martin
# VU-NET the other way.
#
#   eth0      untagged  -> Dante   (PVID 201)  <- clients live here
#   eth0.200  tagged    -> Control              <- Martin amps live here
#
# What moves with client_vlan: reflection direction, the unicast forward rule,
# and the SNAT target. What does NOT move: the PTP/AES67/ATP denies, which stay
# anchored to Control so the amp stack stays quiet.
#
# Verified on a live rig: VU-NET reaches amps over TCP 63489 through SNAT (12
# amps, sessions long-lived), and discovers them from the reflected
# 239.254.10.2 group. See config/allowlists/vunet.yaml.

hostname: combiner
physical_interface: eth0
status_listen: ":8080"

# Control clients are on Dante Primary, not Control.
client_vlan: dante

vlans:
  # Martin Control — the amps. Reflected peer, and the VLAN the denies protect.
  control:
    id: 200
    address: 10.200.0.1
    prefix: 21
    interface_name: eth0.200
  # Dante Primary — untagged (the port's PVID). Control clients attach here.
  dante:
    id: 201
    address: 10.201.0.1
    prefix: 21
    untagged: true

mgmt_dhcp:
  enabled: false

# Clients are on Dante now, so Dante must be able to reach SSH and the status
# page or the operator has no way in. Control stays permitted for a laptop
# patched into the amp VLAN.
management_access: [dante, control]

# Only VU-NET is reflected. Dante, Shure and Lake are all native to the client
# VLAN in this topology and must NOT be listed — config rejects a peer role
# that matches client_vlan.
allowlist_files:
  - allowlists/vunet.yaml

deny_multicast_prefixes:
  - 224.0.1.128/30          # PTP 224.0.1.128-131
  - 224.0.1.132/32          # PTP 224.0.1.132
  - 239.69.0.0/16           # AES67 media
  - 239.254.3.3/32          # PTP logging

dante_unicast_udp_ports:
  - 4440
  - 4444
  - 4455
  - 8751
  - 8800
