name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt needed:" && gofmt -l . && exit 1)

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make shellcheck

      - name: go test
        run: go test ./...

      - name: build
        run: make build

      - name: cross-build Pi and amd64
        run: |
          make build-pi
          make build-pi-arm
          make build-linux-amd64

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "PyYAML>=6" "ruff>=0.8" "mypy>=1.13" "pytest>=8" "types-PyYAML>=6"

      - name: ruff
        run: |
          python -m ruff check deploy/pi
          python -m ruff format --check deploy/pi

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest

      - name: generate-check
        run: make generate-check
